[project]
name = "bobo"
version = "0.1.0"
description = "A silly little Python project used to try the Farejador reviewer"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bobo = "bobo.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bobo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
